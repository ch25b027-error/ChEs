<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <article class="card">

      <header class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="titlebar-text">profile.exe</span>
      </header>

      <section class="hero">
        <div class="sun" aria-hidden="true"></div>
        <img class="photo" src="profilepic.jpeg"></img>
        <span class="sticker">Open to work</span>
      </section>

      <section class="info">
        <h1>Siva Shankar</h1>
        <p class="job">Aspiring Developer</p>
        <p class="bio">
          Agonizing Chemical Engineering Student who is struggling with CMTP and intersted in Softeware.
        </p>
        <a class="btn" href="https://github.com/ch25b027-error">Follow me on Github</a>
      </section>

    </article>
  </main>
</body>
</html>
